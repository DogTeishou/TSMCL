name: Build Binary

on:
  push:
    tags:
      - 'v*'
      - 'v*-alpha'
      - 'v*-beta'

permissions:
  contents: write # 允许创建和上传 GitHub Release

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          # Linux x86_64 (musl)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          # macOS Apple Silicon (M1/M2/M3/M4)
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross (for Linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com

      - name: Build binary
        env:
          TSMCL_CLIENT_ID: ${{ vars['TSMCL_CLIENT_ID'] }}
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --target ${{ matrix.target }} -p main
          else
            cargo build --release --target ${{ matrix.target }} -p main
          fi
        shell: bash

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_NAME=$(grep '^name =' Cargo.toml | head -n1 | cut -d '"' -f2)
          ARCHIVE_NAME="${BIN_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" "${BIN_NAME}"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BIN_NAME = (Select-String -Path Cargo.toml -Pattern '^name\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $ARCHIVE_NAME = "${BIN_NAME}-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target\${{ matrix.target }}\release\${BIN_NAME}.exe" -DestinationPath $ARCHIVE_NAME
          $HASH = (Get-FileHash $ARCHIVE_NAME -Algorithm SHA256).Hash.ToLower()
          "$HASH  $ARCHIVE_NAME" | Out-File -FilePath "${ARCHIVE_NAME}.sha256" -Encoding ascii

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            *.sha256
