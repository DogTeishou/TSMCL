[package]
name = "http_downloader"
edition = "2024"
version.workspace = true

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
tokio-util = "0.7.20"
hex = "0.4.3"
sha-1 = "0.10.1"
reqwest = { version = "0.13.5", features = ["default", "stream"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }